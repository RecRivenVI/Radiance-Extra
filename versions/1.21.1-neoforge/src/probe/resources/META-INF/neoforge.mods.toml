modLoader="javafml"
loaderVersion="[4,5)"
license="${mod_license}"

[[mods]]
modId="${mod_id}_probe"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"

[[mixins]]
config="radiance-extra-probe.mixins.json"

[[dependencies.${mod_id}_probe]]
modId="neoforge"
type="required"
versionRange="[${loader_minimum},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="CLIENT"

# Temporary exact compatibility pins for the current parent-mod distributions.
# Missing mods are allowed; installed versions must match. Libraries without a mod ID are excluded.
[[dependencies.${mod_id}_probe]]
modId="create"
type="optional"
versionRange="[${create_metadata_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="flywheel"
type="optional"
versionRange="[${flywheel_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="ponder"
type="optional"
versionRange="[${ponder_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="sable"
type="optional"
versionRange="[${sable_metadata_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="sablecompanion"
type="optional"
versionRange="[${sablecompanion_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="veil"
type="optional"
versionRange="[${veil_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="aeronautics_bundled"
type="optional"
versionRange="[${aeronautics_metadata_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="aeronautics"
type="optional"
versionRange="[${aeronautics_metadata_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="simulated"
type="optional"
versionRange="[${aeronautics_metadata_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="offroad"
type="optional"
versionRange="[${aeronautics_metadata_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="voxy"
type="optional"
versionRange="[${voxy_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="radiance"
type="required"
versionRange="[${radiance_version}]"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="radiance_probe"
type="required"
versionRange="[${radiance_version}]"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="${mod_id}"
type="required"
versionRange="[${mod_version}]"
ordering="AFTER"
side="CLIENT"
